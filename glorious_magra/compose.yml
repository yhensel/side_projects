services:
  backend:
    build:
      context: ./docker/php
    container_name: backend
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/xdebug-override.ini:/usr/local/etc/php/conf.d/zz-xdebug-override.ini:ro
      - xdebug:/xdebug
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    networks:
      - gloriosus_magra
    env_file:
      - backend/.env

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - gloriosus_magra

  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projects
      MYSQL_USER: projects
      MYSQL_PASSWORD: projects
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gloriosus_magra

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: npm run dev -- --host
    networks:
      - gloriosus_magra

volumes:
  db_data:
  frontend_node_modules:
  xdebug: {}

networks:
  gloriosus_magra:

